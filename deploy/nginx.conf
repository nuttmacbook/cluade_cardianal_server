# /etc/nginx/conf.d/cardianal.conf · แทน chain.example.com ด้วยโดเมนจริง · ใบรับรอง: certbot --nginx -d chain.example.com
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name chain.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name chain.example.com;
  ssl_certificate     /etc/letsencrypt/live/chain.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chain.example.com/privkey.pem;
  client_max_body_size 2m;                               # server ไม่จำกัดขนาด body เอง

  # ไม่ให้คนนอกโหลด snapshot ทั้งเชน (เปิดให้เครื่องสำรองของคุณ: allow <IP>;)
  # location /snapshot { allow 203.0.113.10; deny all; proxy_pass http://127.0.0.1:3000; }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # TRUST_PROXY=1 ใช้ IP นี้ทำ rate limit
    proxy_set_header X-Forwarded-Proto $scheme;                    # GET /evm สร้าง rpcUrl เป็น https
    proxy_set_header Upgrade $http_upgrade;                        # WebSocket ที่ /evm
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }
}
