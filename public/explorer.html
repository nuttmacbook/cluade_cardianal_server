const ABI_FIELD = { address: "address", uint: "number", int: "number", bool: "boolean", string: "text", bytes: "text", object: "object", array: "list", any: "text" };
/** the chosen function in metadata.abi (null = not declared → guess from the code) */
const abiFunction = () => (ix.abi?.functions ?? []).find((f) => f.name === ix.fn) ?? null;

function ixFields() {
  const declared = abiFunction();
  if (declared) return (declared.inputs ?? []).map((f) => ({ name: f.name, type: ABI_FIELD[f.type] ?? "text", description: f.description }));
  return inferInputs(ix.code, ix.fn);
}

function ixInner() {
  if (ix.mode === "json") {
    const rows = Math.min(16, Math.max(4, ix.json.split("\n").length + 1));
    return `<textarea id="args" spellcheck="false" aria-label="Input (JSON)" rows="${rows}">${esc(ix.json)}</textarea>`;
  }
  const fields = ixFields();
  const extra = Object.keys(ix.extra);
  const rows = fields.map((f) => {
    const v = ix.values[f.name] ?? "";
    const id = `ix-${f.name}`;
    const control = f.type === "boolean"
      ? `<select class="ix-f" id="${id}" data-name="${attr(f.name)}" data-type="boolean">${["", "true", "false"].map((o) => `<option value="${o}" ${o === v ? "selected" : ""}>${o === "" ? "— not set —" : o === "true" ? "Yes (true)" : "No (false)"}</option>`).join("")}</select>`
      : f.type === "list" || f.type === "object"
        ? `<textarea class="ix-f" id="${id}" data-name="${attr(f.name)}" data-type="${f.type}" spellcheck="false" rows="3" placeholder="${attr(JSON.stringify(sampleOf(f)))}">${esc(v)}</textarea>`
        : `<input class="ix-f" id="${id}" data-name="${attr(f.name)}" data-type="${f.type}" value="${attr(v)}" autocomplete="off" spellcheck="false"
            ${f.type === "number" ? 'inputmode="numeric" placeholder="0"' : f.type === "address" ? 'placeholder="0x…"' : ""}>`;
    return `<label for="${id}"><span class="ix-name"><span class="mono">${esc(f.name)}</span><span class="ix-type">${TYPE_LABEL[f.type]}</span></span>${control}${
      f.description ? `<span class="dim">${esc(f.description)}</span>` : ""}</label>`;
  }).join("");
  const declared = abiFunction();
  const about = declared ? `<div class="dim ix-none"><span class="tag ok">ABI</span> ${esc(declared.description ?? "Fields from the program's published ABI")}${
    declared.readonly ? " · read-only" : declared.payable ? " · accepts value" : ""}${
    declared.outputs?.length ? ` · returns ${esc(declared.outputs.map((o) => o.name ? `${o.name}: ${o.type}` : o.type).join(", "))}` : ""}</div>` : "";
  return `${about}${rows ? `<div class="ix-fields">${rows}</div>`
    : '<div class="dim ix-none">This function reads nothing from params.input. Switch to JSON to send a custom input.</div>'}
    ${extra.length ? `<div class="dim ix-none">Also sent from the JSON: <span class="mono">${esc(extra.join(", "))}</span></div>` : ""}`;
}

function interactPanel(program, abi = null) {
  const names = callableOf(program.code);
  ix.abi = abi;
  if (ix.program !== program.address) ix = { ...ix, program: program.address, fn: names[0] ?? "", values: {}, json: "{}", extra: {} };
  if (!names.includes(ix.fn)) ix.fn = names[0] ?? "";
  ix.code = program.code;
  const options = names.map((n) => `<option ${n === ix.fn ? "selected" : ""}>${esc(n)}</option>`).join("");
  return `<div class="pad form">
    ${walletRow("Sending a transaction needs a wallet; reading does not")}
    <label>Function<select id="fn" onchange="pickFn(this.value)">${options || "<option>No callable functions</option>"}</select></label>
    <div class="ix-head"><span>Input</span>
      <span class="seg" role="group" aria-label="Input mode">
        <button type="button" data-mode="fields" class="${ix.mode === "fields" ? "on" : ""}" onclick="setMode('fields')">Fields</button>
        <button type="button" data-mode="json" class="${ix.mode === "json" ? "on" : ""}" onclick="setMode('json')">JSON</button>
      </span></div>
    <div id="ix-input" oninput="ixSave()" onchange="ixSave()">${ixInner()}</div>
    <label>Attached value (coins)<input id="val" value="0" inputmode="decimal"></label>
    <div class="row">
      <button class="btn" onclick="runQuery('${program.address}')">Read (no gas)</button>
      <button class="btn solid" onclick="runWrite('${program.address}')">Send transaction</button>
    </div>
    <div class="ixout" id="out" aria-live="polite"><div class="ix-status dim">The result will appear here</div></div>
  </div>`;
}

/** remember what is typed (switching function / mode or reconnecting the wallet keeps it) */
function ixSave() {
  const box = document.getElementById("ix-input");
  if (!box) return;
  if (ix.mode === "json") { ix.json = document.getElementById("args")?.value ?? ix.json; return; }
  for (const f of box.querySelectorAll(".ix-f")) ix.values[f.dataset.name] = f.value;
}

function drawIx() {
  const box = document.getElementById("ix-input");
  if (box) box.innerHTML = ixInner();
  for (const b of document.querySelectorAll(".ix-head .seg button")) b.classList.toggle("on", b.dataset.mode === ix.mode);
}

function pickFn(name) { ixSave(); ix.fn = name; drawIx(); }

/** fields → input object · throws with the field name when a value does not fit its type
 *  (loose = switching to JSON: a value that does not fit is copied as typed, so nothing is lost) */
function fieldsInput(loose = false) {
  const input = { ...ix.extra };
  for (const f of ixFields()) {
    const raw = String(ix.values[f.name] ?? "").trim();
    if (raw === "") { delete input[f.name]; continue; }
    if (f.type === "number") {
      if (!/^-?\d+n?$/.test(raw)) { if (loose) { input[f.name] = raw; continue; } throw new Error(`${f.name} must be a whole number`); }
      input[f.name] = `${raw.replace(/n$/, "")}n`;
    } else if (f.type === "boolean") input[f.name] = raw === "true";
    else if (f.type === "list" || f.type === "object") {
      let v;
      try { v = JSON.parse(raw); } catch {
        if (loose) { input[f.name] = raw; continue; }
        throw new Error(`${f.name} must be JSON, e.g. ${JSON.stringify(sampleOf(f))}`);
      }
      input[f.name] = bigints(v);
    } else input[f.name] = raw;
  }
  return input;
}

function setMode(mode) {
  if (mode === ix.mode) return;
  ixSave();
  try {
    if (mode === "json") ix.json = JSON.stringify(fieldsInput(true), null, 2);
    else {
      const parsed = JSON.parse(ix.json.trim() || "{}");
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("Input must be a JSON object { … }");
      const names = new Set(ixFields().map((f) => f.name));
      ix.values = {};
      ix.extra = {};
      for (const [k, v] of Object.entries(parsed)) {
        if (!names.has(k)) ix.extra[k] = v;
        else ix.values[k] = typeof v === "string" ? (/^-?\d+n$/.test(v) ? v.slice(0, -1) : v)
          : typeof v === "boolean" || typeof v === "number" ? String(v) : JSON.stringify(v);
      }
    }
  } catch (error) { return show(error.message); }
  ix.mode = mode;
  try { localStorage.setItem("ix-mode", mode); } catch {}
  drawIx();
}

const readForm = () => {
  ixSave();
  return {
    functionName: document.getElementById("fn").value,
    input: ix.mode === "json" ? JSON.parse(ix.json || "{}") : fieldsInput(),
    value: toWei(document.getElementById("val").value),
  };
};
// ---------- interact results: the return value up front, the full response folded underneath ----------
//   the box is updated in place (old result stays dimmed while the next one loads) so the page never jumps or blinks
let outSeq = 0;
let fullOpen = false;   // keep "Full response" open / closed between runs
const outBox = () => document.getElementById("out");

/** loading state: keep what is there, dim it, change only the status line */
function busy(text, extra = "") {
  const box = outBox();
  if (!box) return;
  box.classList.add("busy");
  const status = box.querySelector(".ix-status");
  status.className = "ix-status dim";
  status.innerHTML = `<span class="spin"></span>${esc(text)}${extra}`;
}

/** final state: status line · return value (or error) · full response folded */
function showResult({ ok, label, value, error, full, link = "" }) {
  const box = outBox();
  if (!box) return;
  const shown = returnValue(value);
  box.classList.remove("busy");
  box.innerHTML = `<div class="ix-status"><span class="tag ${ok ? "ok" : "bad"}">${ok ? "✓ Success" : "✗ Failed"}</span>
      <span class="dim">${label}</span>${link}</div>
    <div class="ix-ret"><span class="lbl">${ok ? "Return value" : "Error"}</span>
      ${ok ? shown : `<span class="bad">${esc(error ?? "Unknown error")}</span>`}</div>
    ${full === undefined ? "" : `<details class="ix-full" ${fullOpen ? "open" : ""} ontoggle="fullOpen = this.open"><summary>Full response</summary>${json(full)}</details>`}`;
  labelCells(box);
  decorate(box);
}
const show = (message) => showResult({ ok: false, label: "", error: message });
const errorText = (e) => (e == null ? undefined : typeof e === "string" ? e : [e.code, e.message].filter(Boolean).join(": "));
const txLinkBtn = (hash) => ` <a class="ix-link" onclick="go('#tx/${hash}')">View transaction →</a>`;

async function runQuery(program) {
  const seq = ++outSeq;
  try {
    const { functionName, input } = readForm();
    busy("Reading…");
    const res = await api("/query", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ programUuid: program, functionName, input }) });
    if (seq !== outSeq) return;
    const ok = res.status === "success";
    showResult({ ok, label: `Read · ${functionName}()${res.gasUsed !== undefined ? ` · gas ${num(res.gasUsed)}` : ""}`,
      value: res.result, error: errorText(res.error) ?? res.message, full: res });
  } catch (error) { if (seq === outSeq) show(error.message); }
}

/** send → wait for the block → show the call's return value (the user stays on this page) */
async function runWrite(program) {
  const seq = ++outSeq;
  try {
    const { functionName, input, value } = readForm();
    busy("Waiting for the wallet signature…");
    const sent = await sendTx({ action: "call", to: program, method: functionName, input, value });
    if (seq !== outSeq) return;
    if (!sent.queued) return showResult({ ok: false, label: `Transaction · ${functionName}()`, error: errorText(sent.error) ?? "Not accepted", full: sent });
    busy("Sent · waiting for the next block…", txLinkBtn(sent.hash));
    const box = outBox();
    for (let i = 0; i < 120; i += 1) {
      await new Promise((resolve) => setTimeout(resolve, 1000));
      if (seq !== outSeq || !box.isConnected) return;   // another run started or the user left / redrew the page
      const found = await api(`/tx/${sent.hash}`).catch(() => null);
      if (found?.status === "replaced") {
        return showResult({ ok: false, label: `Transaction · ${functionName}()`, error: "Replaced by another transaction with the same nonce",
          full: found, link: txLinkBtn(found.replacedBy) });
      }
      if (found?.status === "rejected" && found.block) {
        return showResult({ ok: false, label: `Transaction · ${functionName}()`, error: `Rejected: ${found.reason}`, full: found, link: txLinkBtn(sent.hash) });
      }
      if (!found?.blockNumber || found.status === "rejected") continue;
      const receipt = await api(`/tx/${sent.hash}/receipt`);
      if (seq !== outSeq || !box.isConnected) return;
      return showResult({ ok: receipt.status === "success",
        label: `Transaction · ${functionName}() · block ${num(receipt.blockNumber)} · gas ${num(receipt.gasUsed)}`,
        value: receipt.result, error: errorText(receipt.error), full: receipt, link: txLinkBtn(sent.hash) });
    }
    busy("Still waiting for a block — check the transaction page", txLinkBtn(sent.hash));
  } catch (error) { if (seq === outSeq) show(error.message); }
}

// ---------- program storage, split by how many parts the key has ----------
//   Variables  1-part keys (owner, price)                → all shown with values
//   Maps       2-part keys (balances:<address>)          → pick the first key in the column header → paged list of second keys + values
//   Lookup     3+ part keys (allowance:<a>:<b>)          → not listed · type each key part (stacked, + adds a part) and read one value
let storageView = { address: null, layout: null, sub: "info", map: "", entries: null, page: 1, get: { name: "", parts: ["", ""] }, results: [] };
const MAP_PAGE = 25;

const keyCell = (k) => (isAddress(k) ? addr(k) : `<span class="mono">${esc(k)}</span>`);

/** reloaded on every draw of a program page (data changes every block) · same program keeps the chosen tab / key / page / lookups */
async function loadLayout(address) {
  const layout = await api(`/program/${address}/layout`).catch(() => ({ variables: [], maps: [], deep: [], scanned: 0 }));
  const same = storageView.address === address;
  const sub = same ? storageView.sub
    : layout.variables.length ? "info" : layout.maps.length ? "storage" : layout.deep.length ? "get" : "info";
  const map = same && layout.maps.some((m) => m.name === storageView.map) ? storageView.map : layout.maps[0]?.name ?? "";
  storageView = { address, layout, sub, map, entries: null, page: same && map === storageView.map ? storageView.page : 1,
    get: same ? storageView.get : { name: layout.deep[0]?.name ?? "", parts: ["", ""] }, results: same ? storageView.results : [] };
  if (map) await loadMap(storageView.page, false);
}

async function loadMap(page = 1, redraw = true) {
  const view = storageView;   // a newer page load may replace storageView while this one waits
  const wanted = Math.max(1, Math.floor(Number(page)) || 1);
  const entries = await api(`/program/${view.address}/entries?name=${encodeURIComponent(view.map)}&page=${wanted}&limit=${MAP_PAGE}`)
    .catch(() => null) ?? { items: [], total: 0, page: 1, pages: 1, limit: MAP_PAGE };
  view.entries = entries;
  view.page = entries.page ?? 1;
  if (redraw) drawStorage();
}

function drawStorage() {
  const box = document.getElementById("storage-panel");
  if (!box) return;
  box.innerHTML = storageInner();
  labelCells(box);
  decorate(box);
}

function pickSub(sub) { readKeys(); storageView.sub = sub; drawStorage(); }
async function pickMap(name) { storageView.map = name; await loadMap(1); }

/** keep what was typed before redrawing (pressing + or switching tabs keeps the inputs) */
function readKeys() {
  const name = document.getElementById("gk-name");
  if (!name) return;
  storageView.get.name = name.value;
  storageView.get.parts = [...document.querySelectorAll(".gk-part")].map((input) => input.value);
}
function addKey() {
  readKeys();
  storageView.get.parts.push("");
  drawStorage();
  [...document.querySelectorAll(".gk-part")].at(-1)?.focus();
}
function dropKey() { readKeys(); if (storageView.get.parts.length > 2) storageView.get.parts.pop(); drawStorage(); }

async function readStorage() {
  readKeys();
  const { name, parts } = storageView.get;
  const keys = [name, ...parts.map((p) => p.trim())];
  if (keys.some((k) => !k)) return alert("Fill in every key part");
  const query = keys.map((k) => `key=${encodeURIComponent(k)}`).join("&");
  const result = await api(`/program/${storageView.address}/get?${query}`);
  storageView.results = [result.error ? { key: keys, error: result.error } : result, ...storageView.results].slice(0, 20);
  drawStorage();
}

function storageBody() {
  const { layout, sub } = storageView;
  if (!layout) return '<div class="empty">Loading…</div>';
  const note = layout.truncated ? `<div class="pad dim" style="font-size:12.5px">Counted from the first ${num(layout.scanned)} keys only (there are more)</div>` : "";

  if (sub === "info") {
    return table(["Key", "Value"], layout.variables.map((v) => `<tr><td>${keyChips([v.key])}</td><td>${anyValue(v.value)}</td></tr>`)) + note;
  }

  if (sub === "storage") {
    if (!layout.maps.length) return '<div class="empty">No 2-part keys</div>';
    const { entries, map } = storageView;
    // the first-key dropdown sits in the column header
    const select = `<select id="map-name" title="First key" onchange="pickMap(this.value)">${layout.maps.map((m) =>
      `<option value="${attr(m.name)}" ${m.name === map ? "selected" : ""}>${esc(m.name)} (${num(m.count)})</option>`).join("")}</select>`;
    return table([select, "Value"], (entries?.items ?? []).map((i) => `<tr><td>${keyCell(i.key)}</td><td>${anyValue(i.value)}</td></tr>`))
      + pager(entries, "loadMap($)") + note;
  }

  // lookup: key parts stacked vertically, + adds a part below
  const { name, parts } = storageView.get;
  const names = layout.deep.map((d) => d.name);
  if (!names.length) return '<div class="empty">No keys with 3 or more parts</div>';
  const rows = parts.map((p, i) => `<label class="krow"><span>Key ${i + 2}</span><input class="gk-part" placeholder="key ${i + 2}" value="${attr(p)}"
      onkeydown="if(event.key==='Enter')readStorage()" spellcheck="false"></label>`).join("");
  const results = storageView.results.map((r) => `<tr><td>${keyChips(r.key)}</td><td>${
    r.error ? `<span class="tag bad">${esc(r.error)}</span>` : r.exists ? anyValue(r.value) : '<span class="dim">No value (never written)</span>'}</td></tr>`);
  return `<div class="pad">
      <div class="getkeys">
        <label class="krow"><span>Key 1</span><select id="gk-name">${names.map((n) =>
          `<option value="${attr(n)}" ${n === name ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
        ${rows}
        <div class="krow"><span></span><div class="row">
          <button class="btn" onclick="addKey()" title="Add a key part">+ key</button>
          ${parts.length > 2 ? '<button class="btn" onclick="dropKey()" title="Remove the last key part">− key</button>' : ""}
          <button class="btn solid" onclick="readStorage()">Read value</button>
        </div></div>
        <div class="krow"><span></span><span>${layout.deep.map((d) => `${esc(d.name)}: ${plural(d.count, "key")} · ${d.depth} parts deep`).join(" · ")}</span></div>
      </div>
    </div>` + (results.length ? table(["Key", "Value"], results) : "") + note;
}

const storagePanel = () => `<div id="storage-panel">${storageInner()}</div>`;

function storageInner() {
  const { layout, sub } = storageView;
  const count = (n) => `<b>${num(n)}</b>`;
  const tab = (id, label, n) => `<button class="tab ${sub === id ? "on" : ""}" data-sub="${id}" onclick="pickSub('${id}')">${label}${n === undefined ? "" : count(n)}</button>`;
  return `<div class="sub">
      ${tab("info", "Variables", layout?.variables.length ?? 0)}
      ${tab("storage", "Maps", layout?.maps.reduce((sum, m) => sum + m.count, 0) ?? 0)}
      ${tab("get", "Lookup")}
    </div>
    <div id="storage-box">${storageBody()}</div>`;
}

// ---------- tabs ----------
let tabState = {};
function tabs(groups) {
  const key = location.hash;
  const active = tabState[key] ?? groups.find((g) => g.body)?.id ?? groups[0].id;
  const head = groups.map((g) => `<button class="tab ${g.id === active ? "on" : ""}" data-tab="${g.id}" onclick="pickTab('${g.id}')">${g.label}${
    g.count === undefined ? "" : `<b>${num(g.count)}</b>`}</button>`).join("");
  const current = groups.find((g) => g.id === active) ?? groups[0];
  return `<section class="panel"><div class="tabs scroll">${head}</div><div class="${current.pad ? "pad" : "body"}">${current.body}</div></section>`;
}
function pickTab(id) {
  if (document.querySelector("button.tab.on[data-tab]")?.dataset.tab === id) return;   // already open: keep what was typed
  tabState[location.hash] = id;
  render(true);
}

// ---------- address / program ----------
/** token URI of an NFT: http(s) → link · ipfs:// and others → text (never a script link) */
function nftUri(uri) {
  if (!uri) return '<span class="dim">—</span>';
  const href = /^https?:\/\//i.test(uri) ? safeHref(uri) : null;
  return href ? `<a class="mono" href="${attr(href)}" target="_blank" rel="noopener noreferrer nofollow">${esc(cut(uri))} ↗</a>`
    : `<span class="mono" title="${attr(uri)}">${esc(cut(uri))}</span>`;
}
async function address(value, draw = el) {
  const [data, tokens, nfts] = await Promise.all([api(`/address/${value}?limit=1`), api(`/address/${value}/tokens`).catch(() => []),
    api(`/address/${value}/nfts`).catch(() => [])]);
  const program = data.isProgram ? await api(`/program/${value}?limit=1`) : null;
  // programs: calls and events page by cursor (no counting cap) · the tab counts come from one cheap counted request
  const [incoming, outgoing, events, holders, , rejected, callCount, eventCount] = await Promise.all([
    program ? cursored(`/program/${value}/interactions`, "in") : paged(`/address/${value}/incoming`, "in"),
    paged(`/address/${value}/txs`, "out"),
    program ? cursored(`/program/${value}/events`, "events") : null,
    program?.token ? paged(`/token/${value}/holders`, "holders", 25) : null,
    program ? loadLayout(program.address) : null,
    cursored(`/address/${value}/rejected`, "rej"),
    program ? api(`/address/${value}/incoming?limit=1`).catch(() => null) : null,
    program ? api(`/program/${value}/events?limit=1`).catch(() => null) : null,
  ]);
  const countOf = (res) => (res ? `${num(res.total)}${res.truncated ? "+" : ""}` : undefined);

  // Status = the whole tx (same as the tx page) · a nested call that failed inside a successful tx says so beside it
  const callState = (t) => {
    const tx = t.txStatus ?? t.status;
    const call = t.depth && t.status !== "success" && tx === "success"
      ? ` <span class="warn" title="This call into the program failed, but a program above caught the error, so the transaction still succeeded">⚠ caught</span>` : "";
    return state(tx) + call;
  };
  const inRows = incoming.items.map((t) => `<tr><td>${txLink(t.hash)}</td><td>${addr(t.from)}${
      t.depth ? ` <span class="tag" title="Called through another program">Nested · depth ${t.depth}</span>` : ""}</td><td>${actionTag(t.action)}</td>
    <td class="mono">${t.method ? esc(t.method) : "—"}</td><td>${callState(t)}</td>
    <td>${blockNo(t.blockNumber)}</td>
    <td class="dim" title="${when(t.timestamp)}">${age(t.timestamp)}</td></tr>`);
  const outRows = outgoing.items.map((t) => `<tr><td>${txLink(t.hash)}</td><td>${actionTag(t.action)}</td>
    <td>${t.nonce}</td><td>${state(t.status)}</td><td>${gas(t.gasUsed)}</td>
    <td class="dim" title="${when(t.timestamp)}">${age(t.timestamp)}</td></tr>`);

  // tokens held: found from Transfer events sent to this address · zero balances hidden
  const held = slicePage(tokens, pageOf("tokens"));
  const tokenRows = held.items.map((t) => `<tr><td><span class="ico coin"></span><b>${esc(t.ticker)}</b></td>
    <td>${addr(t.address, t.name)}</td><td class="mono" style="text-align:right">${units(t.balance, t.decimals)}</td>
    <td class="dim">${num(t.decimals)}</td></tr>`);
  // NFTs held (ERC-721 pieces / ERC-1155 balances): collections found from transfer events · zero balances hidden
  const nftPage = slicePage(nfts, pageOf("nfts"));
  const nftRows = nftPage.items.map((n) => `<tr><td>${addr(n.program, n.name || n.symbol)}</td><td><span class="tag">${esc(n.standard)}</span></td>
    <td class="mono">#${num(n.tokenId)}</td><td class="mono" style="text-align:right">${num(n.amount)}</td><td>${nftUri(n.uri)}</td></tr>`);
  const groups = [
    ...(tokens.length ? [{ id: "tokens", label: "Tokens", count: tokens.length,
      body: table(["Token", "Program", "Balance", "Decimals"], tokenRows) + pager(held, "setPage('tokens',$)") }] : []),
    ...(nfts.length ? [{ id: "nfts", label: "NFTs", count: nfts.length,
      body: table(["Collection", "Standard", "Token ID", "Amount", "URI"], nftRows) + pager(nftPage, "setPage('nfts',$)") }] : []),
  ];
  if (holders) {
    const supply = toBig(program.token.totalSupply);
    const holderRows = holders.items.map((h, i) => {
      const share = supply > 0n ? Number((toBig(h.balance) * 1_000_000n) / supply) / 10_000 : 0;
      return `<tr><td class="dim">${num((holders.page - 1) * holders.limit + i + 1)}</td><td>${addr(h.address)}</td>
        <td class="mono" style="text-align:right">${units(h.balance, program.token.decimals)}</td>
        <td class="mono"><span class="share" style="width:${Math.max(2, Math.min(60, share * 0.6))}px"></span>${share.toFixed(4)}%</td></tr>`;
    });
    groups.push({ id: "holders", label: "Holders", count: holders.total,
      body: table(["Rank", "Address", "Balance", "Share"], holderRows) + pager(holders, "setPage('holders',$)") });
  }
  groups.push(
    { id: "in", label: program ? "Calls" : "Incoming", count: program ? countOf(callCount) : incoming.total,
      body: table(["Hash", "From", "Type", "Method", "Status", "Block", "Age"], inRows) + (program ? cursorPager(incoming, "in") : pager(incoming, "setPage('in',$)")) },
    { id: "out", label: "Outgoing", count: outgoing.total,
      body: table(["Hash", "Type", "Nonce", "Status", "Gas", "Age"], outRows) + pager(outgoing, "setPage('out',$)") },
  );
  // txs this address sent that were turned away (recorded in blocks, never ran)
  if (rejected.items.length || rejected.pageNo > 1) {
    groups.push({ id: "rejected", label: "Rejected", body: table(["Hash", "Type", "Nonce", "Stage", "Reason", "Block", "Age"], rejected.items.map((r) => txRow(r, [
      txLink(r.hash), actionTag(r.action), r.nonce ?? "—", stageTag(r.stage), `<span class="bad">${esc(r.reason)}</span>`, blockNo(r.blockNumber),
      `<span class="dim" title="${when(r.timestamp)}">${age(r.timestamp)}</span>`]))) + cursorPager(rejected, "rej") });
  }
  if (program) {
    groups.push({ id: "code", label: "Code", pad: true, body: `<pre>${esc(JSON.parse('"' + program.code + '"'))}</pre>` });
    const abi = data.metadata?.abi ?? null;
    groups.push({ id: "interact", label: "Interact", body: interactPanel(program, abi) });
    groups.push({ id: "event", label: "Events", count: countOf(eventCount),
      body: table(["Name", "Data", "Tx", "Block"], events.items.map((e) =>
        `<tr><td><span class="tag">${esc(e.name)}</span></td><td>${eventData(e, abi)}</td>
         <td>${txLink(e.txHash)}</td><td>${blockNo(e.blockNumber)}</td></tr>`)) + cursorPager(events, "events") });
    if (abi) groups.push({ id: "abi", label: "ABI", pad: true, body: abiView(abi) });
    groups.push({ id: "storage", label: "Storage", count: storageView.layout?.scanned, body: storagePanel() });
    groups.push({ id: "upgrade", label: "Upgrade", body: upgradePanel(program, data.metadata ?? {}) });
    if (hasEip712Permit(program)) groups.push({ id: "permit", label: "Permit", body: permitPanel(program) });
  } else {
    // a wallet sets its own metadata (signed by that wallet) · a program's metadata comes from its code (setMetadata)
    groups.push({ id: "meta", label: "Edit metadata", body: metaPanel(data) });
  }

  const meta = data.metadata ?? {};
  draw(panel(data.isProgram ? "Program" : "Address", kv([
      ["Address", `<span class="mono full">${icon(data.address, true)}${esc(data.address)}</span>${copy(data.address)}`],
      ["Information", `<div class="info" id="meta-info">${avatar(meta)}${meta.namespace ? `<span class="tag">${esc(meta.namespace)}</span>` : '<span class="dim">No name set</span>'}</div>`],
      meta.description && ["Description", esc(meta.description)],
      (meta.url || meta.contact) && ["Links", `<div class="links">${meta.url ? extLink("url", meta.url) : ""}${meta.contact ? extLink("contact", meta.contact) : ""}</div>`],
      ["Balance", `<b>${coin(data.native.balance)}</b>`],
      ["Received / sent / gas paid", `${coin(data.native.received)} · ${coin(data.native.sended)} · ${coin(data.native.consumed)}`],
      ["Nonce", data.nonce],
      program?.token && ["Token", `<span class="ico coin"></span><b>${esc(program.token.name)}</b> <span class="tag">${esc(program.token.ticker)}</span>
        <span class="dim">· ${num(program.token.decimals)} decimals · supply ${units(program.token.totalSupply, program.token.decimals)}</span>`],
      program?.collection && ["Collection", `<b>${esc(program.collection.name || "—")}</b>${program.collection.symbol ? ` <span class="tag">${esc(program.collection.symbol)}</span>` : ""}
        <span class="dim">· ${esc(program.collection.standard)}${program.collection.totalSupply ? ` · ${num(program.collection.totalSupply)} minted` : ""}</span>`],
      program && ["Creator", addr(data.metadata.creator)],
      program && ["Created", when(data.metadata.createdAt)],
      // upgrade / clone: version (no metadata = 1), who may upgrade (none = immutable), template it was cloned from
      program && ["Version", `${esc(meta.version ?? 1)}${program.pendingUpgrade ? ' <span class="tag">Upgrade pending review</span>' : ""}${
        program.scheduledUpgrade ? ` <span class="tag">Upgrade active from block ${esc(program.scheduledUpgrade.activateAt)}</span>` : ""}`],
      program && ["Upgrader", meta.upgrader ? addr(meta.upgrader) : '<span class="dim">None (immutable)</span>'],
      program && meta.template && ["Template", addr(meta.template)],
    ])) + tabs(groups));
}

// ---------- signed actions with a status box: send, wait for the block, report ----------
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const writeOut = (id, v) => { const box = document.getElementById(id); if (box) box.innerHTML = typeof v === "string" ? v : jsonHtml(v); };

/** wait until the tx is in a block (→ receipt) or recorded as rejected (→ { status: "rejected" }) · null = still waiting */
async function waitForTx(hash, tries = 90) {
  for (let i = 0; i < tries; i += 1) {
    await sleep(700);
    const found = await api(`/tx/${hash}`).catch(() => null);
    if (found?.status === "rejected" && found.block) return found;
    if (found?.status === "replaced") return found;
    if (found?.blockNumber && found.status !== "rejected") return api(`/tx/${hash}/receipt`);
  }
  return null;
}

/** sign + send fields, wait for the outcome and write it to the box #outId · returns the receipt when it succeeded */
async function signedAction(outId, label, fields) {
  const out = (v) => writeOut(outId, v);
  try {
    out(esc(`${label}: waiting for the wallet signature…`));
    const sent = await sendTx(fields);
    if (!sent.queued) { out(sent); return null; }
    out(`${esc(label)}: sent · waiting for the next block…${txLinkBtn(sent.hash)}`);
    const result = await waitForTx(sent.hash);
    if (!result) { out(`${esc(label)}: still waiting for a block — check the transaction page${txLinkBtn(sent.hash)}`); return null; }
    if (result.status !== "success") {
      out(`<span class="tag bad">✗ ${esc(STATUS[result.status] ?? result.status)}</span> ${esc(label)}: ${esc(result.reason ?? result.error?.message ?? "")}${txLinkBtn(sent.hash)}`);
      return null;
    }
    out(`<span class="tag ok">✓ Success</span> ${esc(label)} · block ${num(result.blockNumber)}${txLinkBtn(sent.hash)}`);
    return result;
  } catch (error) { out(esc(`Error: ${error.message}`)); return null; }
}

/** typed JSON (input / migrate input) → object with whole numbers as "123n" */
function jsonInput(id, label) {
  const raw = document.getElementById(id)?.value.trim() || "{}";
  let value;
  try { value = JSON.parse(raw); } catch { throw new Error(`${label} must be JSON, e.g. { "supply": 1000 }`); }
  if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error(`${label} must be a JSON object { … }`);
  return bigints(value);
}

// ---------- review a deployed program (admin: init / reject) ----------
async function reviewProgram(address, action) {
  const done = await signedAction("review-out", action === "init" ? "Approve program" : "Reject program", { action, to: address });
  if (done) { await render(true); writeOut("review-out", `<span class="tag ok">✓ Success</span> ${action === "init" ? "Approved" : "Rejected"} ${addr(address)}`); decorate(); }
}

// ---------- permit tab of a token (ERC-2612): the owner signs EIP-712 typed data with eth_signTypedData_v4 ----------
//   domain { name: name(), version: "1", chainId, verifyingContract: token } · Permit(owner, spender, value, nonce, deadline)
//   deadline = unix seconds (EIP-2612) · tokens deployed before EIP-712 (JSON digest) have no eip712Digest in their code → no tab
const PERMIT_TYPE = [{ name: "owner", type: "address" }, { name: "spender", type: "address" }, { name: "value", type: "uint256" },
  { name: "nonce", type: "uint256" }, { name: "deadline", type: "uint256" }];
const hasEip712Permit = (program) => Boolean(program.token) && callableOf(program.code).includes("permit")
  && callableOf(program.code).includes("nonces") && sourceOf(program.code).includes("eip712Digest(");
let permitSigned = null;   // last signed permit { program, input, typed } — shown again after a redraw

/** typed amount in token units ("1.5") → smallest unit (bigint) */
function toUnits(text, decimals, label) {
  const d = Number(String(decimals ?? "0").replace(/n$/, "")) || 0;
  const t = String(text ?? "").trim();
  if (!/^\d+(\.\d+)?$/.test(t)) throw new Error(`${label} must be a number, e.g. 1.5`);
  const [whole, frac = ""] = t.split(".");
  if (frac.length > d) throw new Error(`${label}: at most ${d} decimals`);
  return BigInt(whole) * 10n ** BigInt(d) + BigInt(frac.padEnd(d, "0") || "0");
}

function permitPanel(program) {
  const token = program.token;
  const soon = Math.floor(Date.now() / 1000) + 3600;
  const signed = permitSigned?.program === program.address ? permitSigned : null;
  return `<div class="pad form" id="permit-panel">
    ${walletRow("The owner (connected wallet) signs an EIP-2612 permit with eth_signTypedData_v4 — anyone can submit it")}
    <div class="dim">Domain: name <b>${esc(token.name)}</b> · version 1 · this chain's chainId · verifyingContract ${addr(program.address)}</div>
    <label>Spender<input id="permit-spender" placeholder="0x…" spellcheck="false" autocomplete="off"></label>
    <label>Value (${esc(token.ticker)})<input id="permit-value" inputmode="decimal" placeholder="1.5"></label>
    <label>Deadline (unix seconds)<input id="permit-deadline" inputmode="numeric" value="${soon}" oninput="permitWhen()"></label>
    <div class="dim" id="permit-when">${when(soon * 1000)}</div>
    <div class="row"><button class="btn" id="permit-sign" onclick="signPermit('${program.address}')">Sign permit</button>
      <button class="btn solid" id="permit-send" onclick="submitPermit('${program.address}')">Sign &amp; submit</button>
      <span class="dim">Submit sends permit(owner, spender, value, deadline, signature) as a transaction</span></div>
    <div class="out" id="permit-sig">${signed ? permitSigView(signed) : "Nothing signed yet"}</div>
    <div class="out" id="permit-out">Nothing sent yet</div>
  </div>`;
}

function permitWhen() {
  const seconds = Number(document.getElementById("permit-deadline")?.value);
  const box = document.getElementById("permit-when");
  if (box) box.textContent = Number.isSafeInteger(seconds) && seconds > 0 ? when(seconds * 1000) : "Deadline must be whole seconds";
}

const permitSigView = (signed) => `<div><span class="tag ok">✓ Signed</span> nonce ${esc(signed.typed.message.nonce)} · deadline ${esc(when(Number(signed.typed.message.deadline) * 1000))}</div>
  <div class="dim">Signature</div><div class="mono full" id="permit-signature">${esc(signed.input.signature)}</div>
  <details class="ix-full"><summary>permit input (submit from anywhere)</summary>${json(signed.input)}</details>
  <details class="ix-full"><summary>Typed data (eth_signTypedData_v4)</summary>${json(signed.typed)}</details>`;

/** build the typed data from the form, ask the wallet to sign it → { program, input, typed } */
async function signPermitData(program) {
  const view = await api(`/program/${program}`);
  const token = view.token;
  if (!token) throw new Error("This program is not a token");
  const spender = document.getElementById("permit-spender").value.trim();
  if (!isAddress(spender)) throw new Error("Spender must be an address 0x… (40 hex characters)");
  const value = toUnits(document.getElementById("permit-value").value, token.decimals, "Value");
  const deadline = document.getElementById("permit-deadline").value.trim();
  if (!/^\d+$/.test(deadline)) throw new Error("Deadline must be unix seconds (whole number)");
  if (!wallet) await connect(false);
  const info = await api("/genesis");
  const nonce = await api("/query", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ programUuid: program, functionName: "nonces", input: { owner: wallet } }) });
  if (nonce.status !== "success") throw new Error(errorText(nonce.error) ?? "Could not read nonces");
  const typed = {
    types: { EIP712Domain: [...DOMAIN_TYPE, { name: "verifyingContract", type: "address" }], Permit: PERMIT_TYPE },
    primaryType: "Permit",
    domain: { name: token.name, version: "1", chainId: info.chainId, verifyingContract: program },
    message: { owner: wallet, spender: spender.toLowerCase(), value: value.toString(), nonce: toBig(nonce.result).toString(), deadline },
  };
  const signature = await window.ethereum.request({ method: "eth_signTypedData_v4", params: [wallet, JSON.stringify(typed)] });
  const input = { owner: wallet, spender: spender.toLowerCase(), value: `${value}n`, deadline: `${deadline}n`, signature };
  return { program, input, typed };
}

async function signPermit(program) {
  try {
    writeOut("permit-sig", esc("Waiting for the wallet signature…"));
    permitSigned = await signPermitData(program);
    writeOut("permit-sig", permitSigView(permitSigned));
  } catch (error) { writeOut("permit-sig", esc(`Error: ${error.message}`)); }
}

/** sign (fresh, so the nonce is current) and send permit(...) as a transaction from the connected wallet */
async function submitPermit(program) {
  try {
    writeOut("permit-sig", esc("Waiting for the wallet signature…"));
    permitSigned = await signPermitData(program);
    writeOut("permit-sig", permitSigView(permitSigned));
  } catch (error) { return writeOut("permit-sig", esc(`Error: ${error.message}`)); }
  const done = await signedAction("permit-out", "Permit", { action: "call", to: program, method: "permit", input: permitSigned.input });
  if (!done) return;
  const allowance = await api("/query", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ programUuid: program, functionName: "allowance", input: { owner: permitSigned.input.owner, spender: permitSigned.input.spender } }) });
  const box = document.getElementById("permit-out");
  if (box) box.insertAdjacentHTML("beforeend", `<div id="permit-allowance">Allowance now <b class="mono">${esc(toBig(allowance.result).toString())}</b> (smallest unit)</div>`);
}

// ---------- upgrade tab of a program: new code (upgrader) · upgrade rights · admin review ----------
const sourceOf = (code) => { try { return JSON.parse(`"${code}"`); } catch { return String(code ?? ""); } };
let renounceArmed = null;   // program whose "Renounce" button was clicked once (a second click sends)

function upgradePanel(program, meta) {
  const upgrader = meta.upgrader ?? null;
  const pending = program.pendingUpgrade, scheduled = program.scheduledUpgrade;
  const mine = wallet && upgrader === wallet;
  const head = (text) => `<div class="ix-head"><span><b>${text}</b></span></div>`;
  return `<div class="pad form" id="upgrade-panel">
    ${walletRow("Upgrades are signed by the wallet: new code and rights by the upgrader, review by an admin")}
    <div class="row"><span>Version <b id="up-version">${esc(meta.version ?? 1)}</b></span><span class="dim">·</span>
      <span>Upgrader ${upgrader ? addr(upgrader) : '<span class="dim">None (immutable)</span>'}</span>
      ${upgrader && wallet ? `<span class="tag ${mine ? "ok" : "bad"}">${mine ? "You are the upgrader" : "This wallet is not the upgrader"}</span>` : ""}</div>
    ${pending ? `${head("Pending upgrade · awaiting review")}
      <div class="dim">Submitted by ${addr(pending.context?.sender)} · migrate input</div>${json(pending.migrateInput ?? {})}
      <pre id="up-pending-code">${esc(sourceOf(pending.code))}</pre>
      <div class="row"><button class="btn solid" id="up-approve" onclick="reviewUpgrade('${program.address}','initUpgrade')">Approve upgrade</button>
        <button class="btn" id="up-reject" onclick="reviewUpgrade('${program.address}','rejectUpgrade')">Reject upgrade</button>
        <span class="dim">Admin only</span></div>` : ""}
    ${scheduled ? `<div class="dim">An approved upgrade becomes active at block ${esc(scheduled.activateAt)}</div>` : ""}
    ${upgrader ? `${head("Submit new code")}
      <label>New code<textarea id="up-code" rows="10" spellcheck="false">${esc(sourceOf(program.code))}</textarea></label>
      <label>Migrate input (JSON, passed to migrate)<textarea id="up-input" rows="2" spellcheck="false">{}</textarea></label>
      <div class="row"><button class="btn solid" id="up-send" onclick="sendUpgrade('${program.address}')">Send upgrade</button>
        <span class="dim">The new code waits for admin review before it runs</span></div>
      ${head("Upgrade rights")}
      <label>New upgrader<input id="up-next" placeholder="0x…" spellcheck="false" autocomplete="off"></label>
      <div class="row"><button class="btn" id="up-transfer" onclick="transferUpgrader('${program.address}')">Transfer upgrade rights</button>
        <button class="btn" id="up-renounce" onclick="renounceUpgrader('${program.address}')">${renounceArmed === program.address ? "Click again to renounce for good" : "Renounce (make immutable)"}</button></div>`
      : '<div class="dim">This program has no upgrader, so its code can never change.</div>'}
    <div class="out" id="up-out">Nothing sent yet</div>
  </div>`;
}

/** after a confirmed upgrade action: redraw the program (version / upgrader / pending) and keep the result line */
async function upgradeDone(label, receipt) {
  if (!receipt) return;
  await render(true);
  writeOut("up-out", `<span class="tag ok">✓ Success</span> ${esc(label)} · block ${num(receipt.blockNumber)}${txLinkBtn(receipt.hash)}`);
}

async function sendUpgrade(program) {
  let fields;
  try {
    const code = document.getElementById("up-code").value;
    if (!code.trim()) throw new Error("Enter the new code");
    fields = { action: "upgrade", to: program, code, input: jsonInput("up-input", "Migrate input") };
  } catch (error) { return writeOut("up-out", esc(error.message)); }
  upgradeDone("Upgrade submitted for review", await signedAction("up-out", "Upgrade", fields));
}

async function transferUpgrader(program) {
  const next = document.getElementById("up-next").value.trim();
  if (!isAddress(next)) return writeOut("up-out", esc("New upgrader must be an address 0x… (40 hex characters)"));
  upgradeDone("Upgrade rights transferred", await signedAction("up-out", "Transfer upgrade rights", { action: "setUpgrader", to: program, input: { upgrader: next.toLowerCase() } }));
}

async function renounceUpgrader(program) {
  if (renounceArmed !== program) {   // two clicks: renouncing can never be undone
    renounceArmed = program;
    document.getElementById("up-renounce").textContent = "Click again to renounce for good";
    return;
  }
  renounceArmed = null;
  upgradeDone("Upgrade rights renounced", await signedAction("up-out", "Renounce upgrade rights", { action: "setUpgrader", to: program, input: { upgrader: null } }));
}

async function reviewUpgrade(program, action) {
  const label = action === "initUpgrade" ? "Upgrade approved" : "Upgrade rejected";
  upgradeDone(label, await signedAction("up-out", action === "initUpgrade" ? "Approve upgrade" : "Reject upgrade", { action, to: program }));
}

// ---------- deploy a program (signed by the wallet, then waits for review) ----------
let deployDraft = { code: "function program() {\n  function initialization(params) {}\n  function ping(params) { return 1n; }\n  return { ping };\n}", input: "{}", value: "0", upgrader: "" };

function deployPage(draw = el) {
  const d = deployDraft;
  draw(panel("Deploy a program", `<div class="pad form" id="deploy-form">
    ${walletRow("Deploying sends a signed transaction · the program runs after an admin approves it")}
    <label>Code<textarea id="dp-code" rows="12" spellcheck="false">${esc(d.code)}</textarea></label>
    <label>Init input (JSON, passed to initialization)<textarea id="dp-input" rows="2" spellcheck="false">${esc(d.input)}</textarea></label>
    <label>Attached value (coins)<input id="dp-value" value="${attr(d.value)}" inputmode="decimal"></label>
    <label>Upgrader (optional · empty = the code can never change)<input id="dp-upgrader" value="${attr(d.upgrader)}" placeholder="0x…" spellcheck="false" autocomplete="off"></label>
    <div class="row"><button class="btn" onclick="useMyWallet()">Use my wallet as upgrader</button>
      <button class="btn solid" id="dp-send" onclick="sendDeploy()">Deploy (send transaction)</button></div>
    <div class="out" id="dp-out">Not sent yet</div>
  </div>`));
}

function saveDeployDraft() {
  for (const field of ["code", "input", "value", "upgrader"]) {
    const input = document.getElementById(`dp-${field}`);
    if (input) deployDraft[field] = input.value;
  }
}

async function useMyWallet() {
  saveDeployDraft();
  try { if (!wallet) await connect(false); } catch (error) { return writeOut("dp-out", esc(error.message)); }
  deployDraft.upgrader = wallet;
  document.getElementById("dp-upgrader").value = wallet;
}

async function sendDeploy() {
  saveDeployDraft();
  let fields;
  try {
    const { code, upgrader } = deployDraft;
    if (!code.trim()) throw new Error("Enter the program code");
    if (upgrader.trim() && !isAddress(upgrader.trim())) throw new Error("Upgrader must be an address 0x… (40 hex characters) or empty");
    fields = { action: "deploy", code, input: jsonInput("dp-input", "Init input"), value: toWei(deployDraft.value),
      ...(upgrader.trim() ? { upgrader: upgrader.trim().toLowerCase() } : {}) };
  } catch (error) { return writeOut("dp-out", esc(error.message)); }
  const receipt = await signedAction("dp-out", "Deploy", fields);
  const program = receipt?.result?.programUuid;
  if (program) writeOut("dp-out", `<span class="tag ok">✓ Deployed</span> ${addr(program, program)} <span class="dim">awaiting approval</span>${txLinkBtn(receipt.hash)}`);
  decorate();
}

// ---------- edit metadata (signed by the wallet) ----------
//   only the connected wallet's own address can be edited (the VM always uses the signer as the address)
//   programs have no edit tab: their metadata is set from code (setMetadata), e.g. icon / url passed to a token at deploy
const META_FIELDS = [
  ["icon", "Icon (image link https:// · data:image · or an emoji)", "https://…/logo.png"],
  ["namespace", "Namespace (must be unique)", "mytoken"],
  ["description", "Description", ""],
  ["url", "URL (website)", "https://…"],
  ["contact", "Contact (email / contact link)", "team@example.com or https://t.me/…"],
];
let metaSource = {};

function metaPanel(data) {
  metaSource = data.metadata ?? {};
  const isOwner = wallet === data.address;
  return `<div class="pad"><div class="metaform">
      <div id="meta-preview">${avatar(metaSource, true)}</div>
      <div class="form">
        <div class="row">${wallet ? `<span class="tag ${isOwner ? "ok" : "bad"}">${isOwner ? "You can edit" : "This wallet cannot edit"}</span> ${addr(wallet)}`
          : '<button class="btn solid" onclick="connect().catch((e) => alert(e.message))">Connect wallet</button>'}
          <span class="dim">Only the owner of this address (the signing wallet) can edit · clearing a field removes it</span></div>
        ${META_FIELDS.map(([field, label, hint]) => `<label>${label}<input id="meta-${field}" value="${attr(metaSource[field] ?? "")}" placeholder="${attr(hint)}"
          spellcheck="false" ${field === "icon" ? 'oninput="previewIcon()"' : ""}></label>`).join("")}
        <div class="row"><button class="btn solid" onclick="saveMeta('${data.address}')">Save (send transaction)</button></div>
        <div class="out" id="meta-out">Not saved yet</div>
      </div></div></div>`;
}

function previewIcon() {
  const icon = document.getElementById("meta-icon").value.trim();
  document.getElementById("meta-preview").innerHTML = avatar({ ...metaSource, icon }, true);
}

/** send only changed fields · a cleared field = null (removed) */
function metaChanges() {
  const changes = {};
  for (const [field] of META_FIELDS) {
    const value = document.getElementById(`meta-${field}`).value.trim();
    const before = metaSource[field] ?? "";
    if (value === String(before)) continue;
    changes[field] = value === "" ? null : value;
  }
  return changes;
}

async function saveMeta(address) {
  const out = (v) => { document.getElementById("meta-out").innerHTML = typeof v === "string" ? esc(v) : jsonHtml(v); };
  try {
    const changes = metaChanges();
    if (!Object.keys(changes).length) return out("Nothing changed");
    if (changes.icon && !isImage(changes.icon) && [...changes.icon].length > 2) return out("Icon must be an https:// image link, a data:image/… URI, or one emoji");
    for (const field of ["url", "contact"]) if (changes[field] && !safeHref(changes[field])) return out(`${field} must be an https://, mailto: or tel: link, or an email address`);
    if (!wallet) await connect(false);
    if (wallet !== address) return out("You can only set metadata for the connected wallet's own address");
    out("Waiting for the wallet signature…");
    const result = await sendTx({ action: "metadata", input: changes });
    out(result);
    if (result.queued) setTimeout(() => go(`#tx/${result.hash}`), 2500);
  } catch (error) { out(`Error: ${error.message}`); }
}

async function search() {
  const value = document.getElementById("q").value.trim();
  if (!value) return;
  if (/^\d+$/.test(value)) return go(`#block/${value}`);
  if (/^0x[0-9a-fA-F]{64}$/.test(value)) return go(`#tx/${value}`);
  if (/^0x[0-9a-fA-F]{40}$/.test(value)) return go(`#address/${value}`);
  const found = await api(`/name/${encodeURIComponent(value)}`);
  if (found.address) return go(`#address/${found.address}`);
  el(panel("Nothing found", `<div class="empty">Nothing matches "${esc(value)}" — try a block number, tx hash, address or name</div>`));
}

/** soft = redraw in place (page / tab change) without the loading placeholder, keeping the scroll position */
let renderSeq = 0;
async function render(soft) {
  const [kind, value] = location.hash.slice(1).split("/");
  const y = scrollY;
  const seq = ++renderSeq;
  markNav();
  // only the newest render may draw: a slower earlier one (another page / tab / page number) is dropped
  const draw = (html) => { if (seq === renderSeq) el(html); };
  if (!soft) document.getElementById("view").innerHTML = '<div class="panel"><div class="empty">Loading…</div></div>';
  if (kind === "block") await block(value, draw);
  else if (kind === "tx") await tx(value, draw);
  else if (kind === "address") await address(value, draw);
  else if (kind === "programs") await programs(draw);
  else if (kind === "deploy") deployPage(draw);
  else await home(draw);
  if (soft && seq === renderSeq) scrollTo(0, y);
}

// ---------- sidebar (drawer on narrow screens) + highlighted section ----------
const sideInfo = { polls: 0 };
const sideOpen = (open) => document.body.classList.toggle("side-open", open);
const sideMenu = () => sideOpen(!document.body.classList.contains("side-open"));
const sideClose = () => sideOpen(false);
const sideGo = (hash) => { sideClose(); go(hash); };
const SIDE_COLORS = ["#7c3aed", "#db2777", "#2563eb", "#0d9488", "#d97706", "#9333ea", "#16a34a", "#e11d48"];
function markNav() {
  const [kind, value] = location.hash.slice(1).split("/");
  const on = new Set(!kind ? ["explore", "home"] : kind === "programs" ? ["programs", `programs-${tabState["#programs"] ?? "pending"}`]
    : kind === "deploy" ? ["deploy"] : ["explore"]);
  if (kind === "block") on.add("block");
  if (kind === "address" && value) { on.add(`a:${value.toLowerCase()}`); if (wallet && value.toLowerCase() === wallet) on.add("me"); }
  for (const node of document.querySelectorAll("[data-nav]")) node.classList.toggle("on", on.has(node.dataset.nav));
  document.getElementById("dbtn").classList.toggle("on", kind === "deploy");
}
async function sidePrograms() {
  const [counts, list, info] = await Promise.all([api("/programs"), api("/programs/approved?limit=8"), api("/genesis")]).catch(() => []);
  if (!counts || !list) return;
  document.getElementById("side-latest").textContent = `#${info?.latest ?? 0}`;
  document.getElementById("side-approved").textContent = num(counts.approved ?? 0);
  document.getElementById("side-review").textContent = num(counts.pending ?? 0);
  document.getElementById("side-programs").innerHTML = (list.items ?? []).map((p, i) => {
    const label = p.name || cut(p.address);
    const kind = p.token ? "TOKEN" : p.collection === "ERC-721" ? "NFT" : p.collection ? "MULTI" : "";
    return `<a data-nav="a:${attr(String(p.address).toLowerCase())}" onclick="sideGo('#address/${attr(p.address)}')" title="${attr(p.address)}"><span class="dot" style="--c:${SIDE_COLORS[i % SIDE_COLORS.length]}">${esc(String(label).replace(/^0x/, "").slice(0, 1).toUpperCase())}</span><span>${esc(label)}</span>${kind ? `<span class="n">${kind}</span>` : ""}</a>`;
  }).join("") || '<div class="hint">No approved programs yet</div>';
  markNav();
}
addEventListener("keydown", (e) => { if (e.key === "Escape") sideClose(); });
sidePrograms();

addEventListener("hashchange", () => render());
render();
setInterval(async () => {
  const info = await api("/genesis").catch(() => null);
  if (!info) return;
  document.getElementById("tick").textContent = `block ${info.latest ?? 0} · ${info.pending} pending`;
  document.getElementById("side-latest").textContent = `#${info.latest ?? 0}`;
  if (++sideInfo.polls % 10 === 0) sidePrograms();
  document.getElementById("wbtn").textContent = wallet ? cut(wallet) : "Connect wallet";
  // refresh the home page only while it shows the newest blocks and nothing is being typed
  if (!location.hash && pageOf("blocks") === 1 && !document.activeElement?.matches("#view input")) { const seq = renderSeq; home((html) => { if (seq === renderSeq && !location.hash) el(html); }); }
}, 2000);   // blocks every 1 s: poll every 2 s (each open tab hits /genesis + the home page)
</script></body></html>
