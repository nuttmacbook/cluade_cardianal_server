<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Program VM Explorer</title>
<style>
:root{
  --bg:#fafafa;--panel:#fff;--line:#e8e8ea;--text:#17171a;--dim:#71717a;--soft:#f4f4f5;
  --ok:#15803d;--ok-bg:#f0fdf4;--bad:#b91c1c;--bad-bg:#fef2f2;--accent:#1d4ed8;--radius:10px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#070b16;--panel:#0d1424;--line:#1b2740;--text:#e6ecf8;--dim:#7e8ca8;--soft:#111b2e;
  --ok:#4ade80;--ok-bg:#0d2019;--bad:#f87171;--bad-bg:#24131a;--accent:#5b9dff;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 ui-sans-serif,system-ui,"Noto Sans Thai",sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;gap:18px;align-items:center}
.brand{font-weight:650;letter-spacing:-.01em;cursor:pointer;white-space:nowrap}
.brand span{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
input{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:9px 14px;border-radius:var(--radius);font:inherit;outline:none}
input:focus{border-color:var(--accent)}
main{max-width:1120px;margin:0 auto;padding:24px;display:grid;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel>h2{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--dim);margin:0;padding:14px 18px;border-bottom:1px solid var(--line);text-transform:uppercase}
.panel>.body{padding:4px 0}.panel>.pad{padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line)}
.stat{background:var(--panel);padding:18px}
.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.stat span{color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;padding:9px 18px;color:var(--dim);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line)}
td{padding:11px 18px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--soft)}
.kv td:first-child{color:var(--dim);width:190px;font-size:13px}
a{color:var(--accent);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px}
.dim{color:var(--dim)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid var(--line);background:var(--soft)}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.tag.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.copy{border:0;background:none;color:var(--dim);cursor:pointer;padding:0 4px;font-size:12px;opacity:.55}
.copy:hover{opacity:1;color:var(--accent)}
pre{background:var(--soft);border-radius:8px;padding:14px;overflow:auto;font-size:12.5px;margin:0;
  font-family:ui-monospace,Menlo,monospace;line-height:1.6}
.trace{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre;line-height:1.9}
.empty{padding:28px 18px;text-align:center;color:var(--dim);font-size:13px}
.nav{display:flex;gap:14px;justify-content:space-between;color:var(--dim);font-size:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.tabs{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--dim);font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--soft);color:var(--text)}
.tab.on{background:var(--text);color:var(--bg);font-weight:500}
.tab b{font-weight:500;opacity:.6;margin-left:5px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:13px;
  padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.solid{background:var(--text);color:var(--bg);border-color:transparent;font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
.form{display:grid;gap:12px}
.form label{display:grid;gap:6px;font-size:12.5px;color:var(--dim)}
.form input,.form textarea,.form select{background:var(--bg);border:1px solid var(--line);color:var(--text);
  padding:9px 12px;border-radius:8px;font:inherit;font-size:13px;width:100%}
.form textarea{font-family:ui-monospace,Menlo,monospace;min-height:84px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.out{background:var(--soft);border-radius:8px;padding:12px;font-family:ui-monospace,Menlo,monospace;
  font-size:12.5px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:720px){
  .bar{flex-wrap:wrap;padding:12px 14px;gap:10px}
  .brand{width:100%}
  main{padding:14px;gap:14px}
  td,th{padding:10px 12px}
  .kv td:first-child{width:118px;font-size:12px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat b{font-size:20px}
  table{font-size:13px}
  .hide-sm{display:none}
}
</style></head><body>
<header><div class="bar">
  <div class="brand" onclick="go('')">Program VM<span id="tick"></span></div>
  <input id="q" placeholder="ค้นหา block / tx / address / ชื่อ" onkeydown="if(event.key==='Enter')search()">
  <button class="btn" id="wbtn" onclick="connect()">เชื่อมต่อ wallet</button>
</div></header>
<main id="view"></main>
<div class="toast" id="toast">คัดลอกแล้ว</div>
<script>
const api = (p, o) => fetch(location.origin + p, o).then((r) => r.json());
const go = (hash) => { location.hash = hash; render(); };
const esc = (v) => String(v ?? "").replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
const cut = (v, head = 10, tail = 8) => (typeof v === "string" && v.length > head + tail + 2 ? v.slice(0, head) + "…" + v.slice(-tail) : v ?? "—");
const num = (v) => (typeof v === "string" && /^-?\d+n$/.test(v) ? BigInt(v.slice(0, -1)).toLocaleString("en-US")
  : typeof v === "number" ? v.toLocaleString("en-US") : v ?? "—");
const when = (t) => (t ? new Date(t).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "medium" }) : "—");
const ago = (t) => { const s = Math.max(0, (Date.now() - t) / 1000);
  return s < 60 ? `${s | 0} วินาทีที่แล้ว` : s < 3600 ? `${s / 60 | 0} นาทีที่แล้ว` : `${s / 3600 | 0} ชั่วโมงที่แล้ว`; };

/** ทุก address และ hash คลิกได้ + ก๊อปปี้ได้ */
const copy = (value) => `<button class="copy" title="คัดลอก" onclick="event.stopPropagation();copyText('${value}')">⧉</button>`;
const addr = (a, label) => (a ? `<span class="mono"><a onclick="go('#address/${a}')">${esc(label ?? cut(a))}</a>${copy(a)}</span>` : '<span class="dim">—</span>');
const txLink = (h, label) => (h ? `<span class="mono"><a onclick="go('#tx/${h}')">${esc(label ?? cut(h))}</a>${copy(h)}</span>` : '<span class="dim">—</span>');
const plain = (v) => (v ? `<span class="mono">${esc(cut(v, 14, 10))}${copy(v)}</span>` : '<span class="dim">—</span>');
const state = (s) => `<span class="tag ${s === "success" ? "ok" : s === "pending" ? "" : "bad"}">${s === "success" ? "สำเร็จ" : s === "throw" ? "ล้มเหลว" : s}</span>`;

function copyText(value) {
  navigator.clipboard?.writeText(value);
  const toast = document.getElementById("toast");
  toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 1200);
}

const panel = (title, inner, pad) => `<section class="panel"><h2>${title}</h2><div class="${pad ? "pad" : "body"}">${inner}</div></section>`;
const more = (label, handler) => `<div class="pad" style="border-top:1px solid var(--line)"><button class="btn" onclick="${handler}">${label}</button></div>`;
const table = (head, rows) => (rows.length
  ? `<table><thead><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`
  : '<div class="empty">ไม่มีข้อมูล</div>');
const kv = (pairs) => `<table class="kv"><tbody>${pairs.filter(Boolean).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</tbody></table>`;
const el = (html) => { document.getElementById("view").innerHTML = html; };

const txRow = (t, columns) => `<tr>${columns.map((c) => `<td>${c}</td>`).join("")}</tr>`;
const actionTag = (a) => `<span class="tag">${a}</span>`;

async function home() {
  const [info, blocks, pending] = await Promise.all([api("/genesis"), api("/blocks?limit=12"), api("/pending")]);
  el(panel("ภาพรวม", `<div class="stats">
      <div class="stat"><b>${num(info.latest ?? 0)}</b><span>block ล่าสุด</span></div>
      <div class="stat"><b>${num(pending.size)}</b><span>tx รอในคิว</span></div>
      <div class="stat"><b>${num(info.burned)}</b><span>เหรียญที่ถูกเผา</span></div>
      <div class="stat"><b>${info.chainId}</b><span>chain id</span></div></div>`)
    + panel("block ล่าสุด", table(["block", "เวลา", "tx", "ผลลัพธ์", "แก๊ส", "ผู้ปิด block"], blocks.map((b) => txRow(b, [
        `<a onclick="go('#block/${b.number}')">#${b.number}</a>`,
        `<span title="${when(b.timestamp)}">${ago(b.timestamp)}</span>`,
        num(b.txCount),
        b.txCount ? `<span class="tag ${b.failedCount ? "bad" : "ok"}">${b.successCount}/${b.txCount}</span>` : '<span class="dim">ว่าง</span>',
        num(b.gasUsed), addr(b.feeRecipient),
      ]))))
    + (pending.size ? panel("รอในคิว", table(["hash", "ผู้ส่ง", "ประเภท", "nonce"], pending.transactions.map((t) =>
        txRow(t, [plain(t.hash), addr(t.sender), actionTag(t.action), t.nonce])))) : ""));
}

async function block(number) {
  const data = await api(`/block/${number}?full=1`);
  const header = data.header ?? data;
  const txs = data.transactions ?? [];
  el(panel(`block #${header.number}`, kv([
      ["เวลา", `${when(header.timestamp)} <span class="dim">· ${ago(header.timestamp)}</span>`],
      ["hash", plain(header.hash)],
      ["block ก่อนหน้า", header.parentHash ? `<span class="mono"><a onclick="go('#block/${header.number - 1}')">${cut(header.parentHash, 14, 10)}</a>${copy(header.parentHash)}</span>` : '<span class="dim">block แรก</span>'],
      ["stateRoot", plain(header.stateRoot)],
      ["ผู้ปิด block", addr(header.feeRecipient)],
      ["จำนวน tx", `${num(header.txCount)} <span class="dim">(สำเร็จ ${header.successCount} · ล้มเหลว ${header.failedCount})</span>`],
      ["ค่าแก๊สรวม", `${num(header.gasUsed)} <span class="dim">· ค่าธรรมเนียม ${num(header.fee)}</span>`],
    ]))
    + panel(`transactions (${txs.length})`, table(["#", "hash", "ประเภท", "จาก", "ถึง", "ฟังก์ชัน", "สถานะ", "แก๊ส"], txs.map((t) =>
        txRow(t, [t.index, txLink(t.hash), actionTag(t.action), addr(t.from), addr(t.to),
          t.method ? `<span class="mono">${esc(t.method)}</span>` : '<span class="dim">—</span>',
          state(t.status), num(t.gasUsed)]))))
    + `<div class="nav"><a onclick="go('#block/${header.number - 1}')">← block ก่อนหน้า</a>
        <a onclick="go('#block/${header.number + 1}')">block ถัดไป →</a></div>`);
}

async function tx(hash) {
  const r = await api(`/tx/${hash}/receipt`);
  if (r.error && !r.hash) return el(panel("ไม่พบ transaction", `<div class="empty">${esc(r.error)}</div>`));
  el(panel("transaction", kv([
      ["สถานะ", state(r.status) + (r.error ? ` <span class="bad">${esc(r.error.message ?? r.error)}</span>` : "")],
      ["hash ของระบบ", plain(r.hash)],
      r.digest && ["hash ที่ผู้ใช้เซ็น", plain(r.digest)],
      ["ประเภท", actionTag(r.action)],
      ["จาก", addr(r.from, r.from)],
      ["ถึง", r.to ? addr(r.to, r.to) : '<span class="dim">—</span>'],
      r.method && ["ฟังก์ชัน", `<span class="mono">${esc(r.method)}</span>`],
      ["nonce", r.nonce ?? "—"],
      ["ค่าแก๊ส", `${num(r.gasUsed)} <span class="dim">× ${r.gasPrice ?? 1} = ${num(r.fee)}</span>`],
      ["เวลา", when(r.timestamp)],
      ["ผลลัพธ์", `<span class="mono">${esc(JSON.stringify(r.result))}</span>`],
    ]))
    + (r.input && Object.keys(r.input).length ? panel("input", `<pre>${esc(JSON.stringify(r.input, null, 2))}</pre>`, true) : "")
    + (r.trace?.length ? panel("การเรียกโปรแกรม", `<div class="pad trace">${r.trace.map((c) =>
        `${"│  ".repeat(c.depth)}${c.status === "success" ? "✓" : "✗"} <a onclick="go('#address/${c.program}')">${cut(c.program)}</a>.${esc(c.method)}`).join("\n")}</div>`) : "")
    + (r.events?.length ? panel("event", table(["ชื่อ", "โปรแกรม", "ข้อมูล"], r.events.map((e) =>
        `<tr><td><span class="tag">${esc(e.name)}</span></td><td>${addr(e.program)}</td>
         <td class="mono">${esc(JSON.stringify(e.data))}</td></tr>`))) : "")
    + (r.stateChanges?.length ? panel("ข้อมูลที่เปลี่ยน", table(["โปรแกรม", "key", "ค่าใหม่"], r.stateChanges.map((s) =>
        `<tr><td>${addr(s.program)}</td><td class="mono">${esc(s.key.join(" / "))}</td><td class="mono">${num(s.after)}</td></tr>`))) : "")
    + (r.nativeChanges?.length ? panel("ยอดเหรียญที่เปลี่ยน", table(["address", "ช่อง", "ค่าใหม่"], r.nativeChanges.map((n) =>
        `<tr><td>${addr(n.address)}</td><td class="dim">${n.field}</td><td class="mono">${num(n.after)}</td></tr>`))) : ""));
}

// ---------- wallet ----------
const DOMAIN_TYPE = [{ name: "name", type: "string" }, { name: "version", type: "string" }, { name: "chainId", type: "uint256" }];
const TX_TYPE = [
  { name: "action", type: "string" }, { name: "from", type: "address" }, { name: "to", type: "string" },
  { name: "method", type: "string" }, { name: "input", type: "string" }, { name: "value", type: "uint256" },
  { name: "nonce", type: "uint256" }, { name: "gasLimit", type: "uint256" }, { name: "gasPrice", type: "uint256" },
];
let wallet = null;

/** canonical JSON แบบเดียวกับฝั่ง VM (เรียง key, bigint เป็น "123n") */
function canonical(value) {
  if (typeof value === "bigint") return JSON.stringify(`${value}n`);
  if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
  if (value && typeof value === "object") {
    return `{${Object.keys(value).sort().map((k) => `${JSON.stringify(k)}:${canonical(value[k])}`).join(",")}}`;
  }
  return JSON.stringify(value ?? null);
}

async function connect() {
  if (!window.ethereum) return alert("ไม่พบ wallet — ติดตั้ง MetaMask ก่อน");
  const [account] = await window.ethereum.request({ method: "eth_requestAccounts" });
  wallet = account.toLowerCase();
  render();
}

/** เซ็นแล้วส่งขึ้น chain — คืนผลจาก /sendtx */
async function sendTx(fields) {
  if (!wallet) await connect();
  const info = await api("/genesis");
  const { nonce } = await api(`/nonce/${wallet}`);
  const tx = { chainId: info.chainId, action: "call", from: wallet, to: "", method: "", input: {},
    value: 0, nonce, gasLimit: 500000, gasPrice: 1, ...fields };

  const message = { action: tx.action, from: tx.from, to: tx.to, method: tx.method,
    input: canonical({ input: tx.input, code: tx.code ?? null }),
    value: tx.value, nonce: tx.nonce, gasLimit: tx.gasLimit, gasPrice: tx.gasPrice };

  const signature = await window.ethereum.request({
    method: "eth_signTypedData_v4",
    params: [wallet, JSON.stringify({ domain: { name: "ProgramVM", version: "1", chainId: tx.chainId },
      types: { EIP712Domain: DOMAIN_TYPE, Transaction: TX_TYPE }, primaryType: "Transaction", message })],
  });

  return api("/sendtx", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ tx, signature }) });
}

/** ชื่อฟังก์ชันที่เรียกได้ อ่านจาก return { … } ท้ายโค้ด */
function callableOf(code) {
  const match = /return\s*\{([^}]*)\}\s*;?\s*\}\s*$/.exec(code.replace(/\\n/g, "\n"));
  return match ? match[1].split(",").map((n) => n.trim()).filter(Boolean) : [];
}

function interactPanel(program) {
  const names = callableOf(program.code);
  const options = names.map((n) => `<option>${esc(n)}</option>`).join("");
  return `<div class="pad form">
    <div class="row">
      ${wallet ? `<span class="tag ok">เชื่อมต่อแล้ว</span> ${addr(wallet, cut(wallet))}`
               : '<button class="btn solid" onclick="connect()">เชื่อมต่อ wallet</button>'}
      <span class="dim">ส่ง tx ต้องเชื่อมต่อ ส่วนการอ่านค่าไม่ต้อง</span>
    </div>
    <label>ฟังก์ชัน<select id="fn">${options || "<option>ไม่มีฟังก์ชันที่เรียกได้</option>"}</select></label>
    <label>input (JSON)<textarea id="args" spellcheck="false">{}</textarea></label>
    <label>เงินที่แนบไป (value)<input id="val" value="0" inputmode="numeric"></label>
    <div class="row">
      <button class="btn" onclick="runQuery('${program.address}')">อ่านค่า (ไม่เสียค่าแก๊ส)</button>
      <button class="btn solid" onclick="runWrite('${program.address}')">ส่ง transaction</button>
    </div>
    <div class="out" id="out">ผลลัพธ์จะแสดงที่นี่</div>
  </div>`;
}

const readForm = () => ({
  functionName: document.getElementById("fn").value,
  input: JSON.parse(document.getElementById("args").value || "{}"),
  value: Number(document.getElementById("val").value || 0),
});
const show = (data) => { document.getElementById("out").textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2); };

async function runQuery(program) {
  try {
    const { functionName, input } = readForm();
    show("กำลังอ่าน…");
    show(await api("/query", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ programUuid: program, functionName, input }) }));
  } catch (error) { show(`ผิดพลาด: ${error.message}`); }
}

async function runWrite(program) {
  try {
    const { functionName, input, value } = readForm();
    show("รอเซ็นใน wallet…");
    const result = await sendTx({ action: "call", to: program, method: functionName, input, value });
    show(result);
    if (result.queued) setTimeout(() => go(`#tx/${result.hash}`), 2500);
  } catch (error) { show(`ผิดพลาด: ${error.message}`); }
}

// ---------- ข้อมูลในโปรแกรม (รองรับหลายร้อย key) ----------
let storageView = { total: 0, groups: [], items: [], next: null, prefix: "", address: null };

async function loadGroups(address) {
  const info = await api(`/program/${address}/groups`).catch(() => ({ total: 0, groups: [] }));
  storageView = { ...storageView, address, total: info.total, groups: info.groups, items: [], next: null, prefix: "" };
}

async function loadStorage(address, prefix = "", append = false) {
  const start = append && storageView.next ? `&start=${encodeURIComponent(storageView.next)}` : "";
  const page = await api(`/program/${address}/storage?limit=50&prefix=${encodeURIComponent(prefix)}${start}`);
  storageView = { ...storageView, address, prefix,
    items: append ? [...storageView.items, ...page.items] : page.items, next: page.next };
  const box = document.getElementById("storage-box");   // ยังไม่ถูกวาดตอนโหลดครั้งแรก
  if (box) box.innerHTML = storageBody();
}

function storageBody() {
  const { items, next, total, prefix } = storageView;
  const rows = items.map((s) => `<tr><td class="mono">${esc(s.key.join(" / "))}</td><td class="mono">${num(s.value)}</td></tr>`);
  return table(["key", "ค่า"], rows)
    + `<div class="pad row dim" style="border-top:1px solid var(--line);font-size:12.5px">
        แสดง ${items.length} จาก ${prefix ? "กลุ่มนี้" : `${total} รายการ`}
        ${next ? `<button class="btn" onclick="loadStorage('${storageView.address}','${prefix}',true)">แสดงเพิ่ม 50 รายการ</button>` : ""}
       </div>`;
}

function storagePanel(address) {
  const chips = [{ name: "ทั้งหมด", value: "", count: storageView.total },
    ...storageView.groups.map((g) => ({ name: g.name, value: g.name, count: g.count }))];
  return `<div class="pad" style="padding-bottom:0">
      <div class="row">${chips.map((c) => `<button class="tab ${storageView.prefix === c.value ? "on" : ""}"
        onclick="loadStorage('${address}','${c.value}')">${esc(c.name)}<b>${c.count}</b></button>`).join("")}</div>
    </div>
    <div id="storage-box">${storageBody()}</div>`;
}

// ---------- แท็บ ----------
let tabState = {};
function tabs(groups) {
  const key = location.hash;
  const active = tabState[key] ?? groups.find((g) => g.body)?.id ?? groups[0].id;
  const head = groups.map((g) => `<button class="tab ${g.id === active ? "on" : ""}" onclick="pickTab('${g.id}')">${g.label}${
    g.count === undefined ? "" : `<b>${g.count}</b>`}</button>`).join("");
  const current = groups.find((g) => g.id === active) ?? groups[0];
  return `<section class="panel"><div class="tabs scroll">${head}</div><div class="${current.pad ? "pad" : "body"}">${current.body}</div></section>`;
}
function pickTab(id) { tabState[location.hash] = id; render(); }

async function address(value) {
  const data = await api(`/address/${value}`);
  const program = data.isProgram ? await api(`/program/${value}`) : null;
  if (program && (storageView.address !== program.address || !storageView.items.length)) {
    await loadGroups(program.address);
    await loadStorage(program.address, storageView.prefix ?? "");   // storagePanel() จะวาดทีเดียว
  }
  const incoming = program?.interactions ?? data.incoming ?? [];

  const inRows = incoming.map((t) => `<tr><td>${txLink(t.hash)}</td><td>${addr(t.from)}${
      t.depth ? ` <span class="tag" title="ถูกเรียกผ่านโปรแกรมอื่น">ซ้อนชั้น ${t.depth}</span>` : ""}</td><td>${actionTag(t.action)}</td>
    <td class="mono hide-sm">${t.method ? esc(t.method) : "—"}</td><td>${state(t.status)}</td>
    <td class="hide-sm"><a onclick="go('#block/${t.blockNumber}')">#${t.blockNumber}</a></td>
    <td class="dim" title="${when(t.timestamp)}">${ago(t.timestamp)}</td></tr>`);
  const outRows = data.transactions.map((t) => `<tr><td>${txLink(t.hash)}</td><td>${actionTag(t.action)}</td>
    <td class="hide-sm">${t.nonce}</td><td>${state(t.status)}</td><td class="hide-sm">${num(t.gasUsed)}</td>
    <td class="dim" title="${when(t.timestamp)}">${ago(t.timestamp)}</td></tr>`);

  const groups = [
    { id: "in", label: program ? "ถูกเรียกใช้" : "รับเข้า", count: incoming.length,
      body: table(["hash", "จาก", "ประเภท", "ฟังก์ชัน", "สถานะ", "block", "เวลา"], inRows) },
    { id: "out", label: "ส่งออก", count: data.transactions.length,
      body: table(["hash", "ประเภท", "nonce", "สถานะ", "แก๊ส", "เวลา"], outRows) },
  ];
  if (program) {
    groups.push({ id: "interact", label: "เรียกใช้โปรแกรม", body: interactPanel(program) });
    groups.push({ id: "event", label: "event", count: program.events.length,
      body: table(["ชื่อ", "ข้อมูล", "tx", "block"], program.events.map((e) =>
        `<tr><td><span class="tag">${esc(e.name)}</span></td><td class="mono">${esc(JSON.stringify(e.data))}</td>
         <td>${txLink(e.txHash)}</td><td class="hide-sm"><a onclick="go('#block/${e.blockNumber}')">#${e.blockNumber}</a></td></tr>`)) });
    groups.push({ id: "storage", label: "ข้อมูล", count: storageView.total, body: storagePanel(program.address) });
    groups.push({ id: "code", label: "โค้ด", pad: true, body: `<pre>${esc(JSON.parse('"' + program.code + '"'))}</pre>` });
  }

  el(panel(data.isProgram ? "โปรแกรม" : "address", kv([
      ["address", `<span class="mono">${esc(cut(data.address, 16, 10))}</span>${copy(data.address)}`],
      data.metadata?.namespace && ["ชื่อ", `<span class="tag">${esc(data.metadata.namespace)}</span>`],
      data.metadata?.description && ["คำอธิบาย", esc(data.metadata.description)],
      ["ยอดคงเหลือ", `<b>${num(data.native.balance)}</b>`],
      ["รับ / ส่ง / ค่าแก๊ส", `${num(data.native.received)} · ${num(data.native.sended)} · ${num(data.native.consumed)}`],
      ["nonce", data.nonce],
      program && ["ผู้สร้าง", addr(data.metadata.creator)],
      program && ["สร้างเมื่อ", when(data.metadata.createdAt)],
    ])) + tabs(groups));
}

async function search() {
  const value = document.getElementById("q").value.trim();
  if (!value) return;
  if (/^\d+$/.test(value)) return go(`#block/${value}`);
  if (/^0x[0-9a-fA-F]{64}$/.test(value)) return go(`#tx/${value}`);
  if (/^0x[0-9a-fA-F]{40}$/.test(value)) return go(`#address/${value}`);
  const found = await api(`/name/${encodeURIComponent(value)}`);
  if (found.address) return go(`#address/${found.address}`);
  el(panel("ไม่พบข้อมูล", `<div class="empty">ไม่พบ "${esc(value)}" — ลองใส่เลข block, tx hash, address หรือชื่อ</div>`));
}

function render() {
  const [kind, value] = location.hash.slice(1).split("/");
  document.getElementById("view").innerHTML = '<div class="panel"><div class="empty">กำลังโหลด…</div></div>';
  if (kind === "block") return block(value);
  if (kind === "tx") return tx(value);
  if (kind === "address") return address(value);
  return home();
}

addEventListener("hashchange", render);
render();
setInterval(async () => {
  const info = await api("/genesis").catch(() => null);
  if (!info) return;
  document.getElementById("tick").textContent = `block ${info.latest ?? 0} · คิว ${info.pending}`;
  document.getElementById("wbtn").textContent = wallet ? cut(wallet, 6, 4) : "เชื่อมต่อ wallet";
  if (!location.hash) home();
}, 3000);
</script></body></html>
